[globals]
;The threshold for feature 10
ECNG_LOW_BALANCE_PIASTERS=50000

;Make no to avoid staff record over the PBX and yes to record
ECNG_RECORD_INTERNAL=yes

; Customer entry point
[ecng4308-customers]
exten => 3000,1,Answer()
same => n,Goto(ecng4308-ivr,s,1)

; Employee dialing and management access
[ecng4308-staff]
exten => _211[123],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => _212[12],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => _213[123],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => _210[123],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => 2201,1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/2201,20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => 2301,1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/2301,20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => 2401,1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/2401,20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

exten => _250[12],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

[ecng4308-retail-teller]
include => ecng4308-staff

[ecng4308-tellers]
include => ecng4308-staff

[ecng4308-alert-agent]
include => ecng4308-staff

[ecng4308-management-destinations]
exten => _240[23],1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/${EXTEN},20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

[ecng4308-managers]
include => ecng4308-staff
include => ecng4308-management-destinations
exten => 2900,1,Gosub(ecng4308-internal-recording-options,s,1)
same => n,Dial(PJSIP/2900,20,i${ECNG_INTERNAL_DIAL_OPTION})
same => n,Hangup()

[ecng4308-ceo]
include => ecng4308-staff
include => ecng4308-management-destinations

; Optional recording for direct employee calls
[ecng4308-internal-recording-options]
exten => s,1,Set(ECNG_INTERNAL_DIAL_OPTION=)
same => n,GotoIf($["${ECNG_RECORD_INTERNAL}" != "yes"]?done)
same => n,Set(CDR(userfield)=ecng4308-internal-${UNIQUEID}.wav)
same => n,Set(ECNG_INTERNAL_DIAL_OPTION=U(ecng4308-internal-record-answered^${UNIQUEID}))
same => n(done),Return()

[ecng4308-internal-record-answered]
exten => s,1,MixMonitor(ecng4308-internal-${ARG1}.wav,b)
same => n,Return()

; Customer transfer destinations
[ecng4308-customer-transfer]
exten => 2301,1,Dial(PJSIP/2301,20,i)
same => n,Hangup()

exten => 2401,1,Dial(PJSIP/2401,20,i)
same => n,Hangup()

; Multilingual customer IVR
[ecng4308-ivr]
exten => s,1,Set(CDR(userfield)=ecng4308-${UNIQUEID}.wav)
same => n,Set(ECNG_SURVEY_SOURCE_ID=${UNIQUEID})
same => n,MixMonitor(ecng4308-${UNIQUEID}.wav)
same => n,Set(ECNG_PROMPTS=ecng4308)
same => n,Gosub(ecng4308-choice,s,1(language-menu,123))
same => n,Set(ECNG_RETAIL_QUEUE=ecng4308-retail)
same => n,ExecIf($["${ECNG_CHOICE}" = "1"]?Set(ECNG_PROMPTS=ecng4308/ar))
same => n,ExecIf($["${ECNG_CHOICE}" = "1"]?Set(ECNG_RETAIL_QUEUE=ecng4308-retail-ar))
same => n,ExecIf($["${ECNG_CHOICE}" = "3"]?Set(ECNG_PROMPTS=ecng4308/fr))
same => n,ExecIf($["${ECNG_CHOICE}" = "3"]?Set(ECNG_RETAIL_QUEUE=ecng4308-retail-fr))
same => n,Set(ECNG_EMERGENCY_QUEUE=ecng4308-emergency-en)
same => n,ExecIf($["${ECNG_CHOICE}" = "1"]?Set(ECNG_EMERGENCY_QUEUE=ecng4308-emergency-ar))
same => n,ExecIf($["${ECNG_CHOICE}" = "3"]?Set(ECNG_EMERGENCY_QUEUE=ecng4308-emergency-fr))

same => n,Gosub(ecng4308-choice,s,1(customer-type-services,12))
same => n,GotoIf($["${ECNG_CHOICE}" = "2"]?prospects)

same => n,Set(ECNG_ATTEMPTS=0)
same => n(authenticate),Set(ECNG_ATTEMPTS=$[${ECNG_ATTEMPTS}+1])
same => n,Read(ECNG_CARD,${ECNG_PROMPTS}/card,0,,1,8)
same => n,GotoIf($["${READSTATUS}" != "OK" | "${ECNG_CARD}" = ""]?retry)
same => n,Read(ECNG_PIN,${ECNG_PROMPTS}/pin,0,,1,8)
same => n,GotoIf($["${READSTATUS}" != "OK" | "${ECNG_PIN}" = ""]?retry)
same => n,Set(ECNG_AUTH=ERROR)
same => n,AGI(ecng4308_auth.py)
same => n,GotoIf($["${ECNG_AUTH}" = "OK"]?authenticated)
same => n,GotoIf($["${ECNG_AUTH}" = "ERROR"]?unavailable)
same => n,Gosub(ecng4308-feature10-pin-failed,s,1)
same => n(retry),Set(ECNG_CARD=)
same => n,Set(ECNG_PIN=)
same => n,Playback(${ECNG_PROMPTS}/auth-failed)
same => n,GotoIf($[${ECNG_ATTEMPTS} < 3]?authenticate:goodbye)

same => n(authenticated),Set(CHANNEL(hangup_handler_push)=ecng4308-feature10-low-balance,s,1)
same => n(menu),Gosub(ecng4308-choice,s,1(main-menu,123))
same => n,GotoIf($["${ECNG_CHOICE}" = "1"]?balance)
same => n,GotoIf($["${ECNG_CHOICE}" = "2"]?faq:teller)
same => n(balance),Set(ECNG_LOCAL_BALANCE_AUDIO=${STRREPLACE(ECNG_BALANCE_AUDIO,ecng4308/,${ECNG_PROMPTS}/)})
same => n,Playback(${ECNG_PROMPTS}/balance&${ECNG_LOCAL_BALANCE_AUDIO}&${ECNG_PROMPTS}/egp)
same => n,Goto(resolved)
same => n(faq),Gosub(ecng4308-choice,s,1(faq-menu,1239))
same => n,GotoIf($["${ECNG_CHOICE}" = "9"]?menu)
same => n,Playback(${ECNG_PROMPTS}/faq-${ECNG_CHOICE})
same => n(resolved),Gosub(ecng4308-choice,s,1(resolved,129))
same => n,GotoIf($["${ECNG_CHOICE}" = "1"]?goodbye)
same => n,GotoIf($["${ECNG_CHOICE}" = "9"]?menu)

same => n(teller),Gosub(ecng4308-choice,s,1(service-menu,123))
same => n,Set(ECNG_SERVICE_QUEUE=${ECNG_RETAIL_QUEUE})
same => n,ExecIf($["${ECNG_CHOICE}" = "2"]?Set(ECNG_SERVICE_QUEUE=ecng4308-corporate))
same => n,ExecIf($["${ECNG_CHOICE}" = "3"]?Set(ECNG_SERVICE_QUEUE=${ECNG_EMERGENCY_QUEUE}))
same => n,Gosub(ecng4308-choice,s,1(survey-consent,12))
same => n,Set(ECNG_SURVEY_CONSENT=${ECNG_CHOICE})

same => n,Set(__TRANSFER_CONTEXT=ecng4308-customer-transfer)
same => n,Set(CHANNEL(hangup_handler_push)=ecng4308-survey-on-hangup,s,1)
same => n(teller-queue),Queue(${ECNG_SERVICE_QUEUE},it,,,90,,ecng4308-survey-agent-answered)

same => n(unavailable),Playback(${ECNG_PROMPTS}/unavailable)
same => n(goodbye),Playback(${ECNG_PROMPTS}/goodbye)
same => n,Hangup()
same => n(prospects),Queue(ecng4308-prospects,i,,,45)
same => n,Goto(unavailable)

; Shared keypad menu and retry handling
[ecng4308-choice]
exten => s,1,Set(ECNG_MENU_ATTEMPTS=0)
same => n(read),Set(ECNG_MENU_ATTEMPTS=$[${ECNG_MENU_ATTEMPTS}+1])
same => n,Read(ECNG_CHOICE,${ECNG_PROMPTS}/${ARG1},1,,1,6)
same => n,Set(ECNG_VALID=${REGEX("^[${ARG2}]$" ${ECNG_CHOICE})})
same => n,GotoIf($["${READSTATUS}" = "OK" & "${ECNG_VALID}" = "1"]?valid)
same => n,Playback(${ECNG_PROMPTS}/invalid)
same => n,GotoIf($[${ECNG_MENU_ATTEMPTS} < 3]?read)
same => n,Playback(${ECNG_PROMPTS}/goodbye)
same => n,Hangup()
same => n(valid),Return()

; Callback options while waiting
[ecng4308-callback-request]
exten => 1,1,Set(ECNG_CALLBACK_NUMBER=${ECNG_REGISTERED_CALLBACK})
same => n,GotoIf($[${REGEX("^(100[12]|110[12])$" ${ECNG_CALLBACK_NUMBER})}]?save,1)
same => n,Playback(${ECNG_PROMPTS}/callback-no-saved)
same => n,Goto(2,1)

exten => 2,1,Read(ECNG_CALLBACK_NUMBER,${ECNG_PROMPTS}/callback-enter,0,,1,8)
same => n,GotoIf($["${READSTATUS}" != "OK"]?resume,1)
same => n,GotoIf($[${REGEX("^(100[12]|110[12])$" ${ECNG_CALLBACK_NUMBER})} = 0]?bad-number)
same => n,Set(ECNG_CALLBACK_INDEX=0)
same => n,While($[${ECNG_CALLBACK_INDEX} < ${LEN(${ECNG_CALLBACK_NUMBER})}])
same => n,Playback(${ECNG_PROMPTS}/digit-${ECNG_CALLBACK_NUMBER:${ECNG_CALLBACK_INDEX}:1})
same => n,Set(ECNG_CALLBACK_INDEX=$[${ECNG_CALLBACK_INDEX}+1])
same => n,EndWhile()
same => n,Read(ECNG_CALLBACK_CONFIRM,${ECNG_PROMPTS}/callback-confirm,1,,1,6)
same => n,GotoIf($["${READSTATUS}" != "OK"]?resume,1)
same => n,GotoIf($["${ECNG_CALLBACK_CONFIRM}" = "1"]?save,1)
same => n,GotoIf($["${ECNG_CALLBACK_CONFIRM}" = "2"]?2,1)
same => n,Goto(resume,1)
same => n(bad-number),Playback(${ECNG_PROMPTS}/invalid)
same => n,Goto(2,1)

exten => save,1,Set(DB(ecng4308-callback-survey/${UNIQUEID})=${ECNG_SURVEY_CONSENT}|${ECNG_PROMPTS})
same => n,Set(DB(ecng4308-callback/${UNIQUEID})=${ECNG_SERVICE_QUEUE}|${ECNG_CALLBACK_NUMBER})
same => n,Playback(${ECNG_PROMPTS}/callback-saved)
same => n,Hangup()

exten => resume,1,Goto(ecng4308-ivr,s,teller-queue)

; Dial the customer on a saved callback request
[ecng4308-callback-dispatch]
exten => _X.,1,Set(ECNG_CB_REQUEST=${DB(ecng4308-callback/${EXTEN})})
same => n,Set(ECNG_CB_NUMBER=${CUT(ECNG_CB_REQUEST,|,2)})
same => n,GotoIf($[${REGEX("^(100[12]|110[12])$" ${ECNG_CB_NUMBER})} = 0]?done)
same => n,Set(ECNG_CB_SURVEY=${DB(ecng4308-callback-survey/${EXTEN})})
same => n,Set(ECNG_CB_CONSENT=${CUT(ECNG_CB_SURVEY,|,1)})
same => n,Set(ECNG_CB_PROMPTS=${CUT(ECNG_CB_SURVEY,|,2)})
same => n,Set(ECNG_CB_TELLER_CHANNEL=${CHANNEL(name)})
same => n,Set(ECNG_CB_TELLER=${CUT(ECNG_CB_TELLER_CHANNEL,-,1)})
same => n,Dial(PJSIP/${ECNG_CB_NUMBER},25,U(ecng4308-callback-answered^${EXTEN}^${ECNG_CB_CONSENT}^${ECNG_CB_PROMPTS}^${ECNG_CB_TELLER}^${ECNG_CB_NUMBER}))
same => n(done),Hangup()

; Clear the answered request and arm its survey if the customer opted in
[ecng4308-callback-answered]
exten => s,1,Set(CDR(userfield)=ecng4308-callback-${ARG1}.wav)
same => n,MixMonitor(ecng4308-callback-${ARG1}.wav,b)
same => n,Set(ECNG_CB_CLEARED=${DB_DELETE(ecng4308-callback/${ARG1})})
same => n,Set(ECNG_CB_SURVEY_CLEARED=${DB_DELETE(ecng4308-callback-survey/${ARG1})})
same => n,GotoIf($["${ARG2}" != "1"]?done)
same => n,Set(ECNG_SURVEY_CONSENT=1)
same => n,Set(ECNG_SURVEY_SOURCE_ID=${ARG1})
same => n,Set(ECNG_SURVEY_AGENT_ANSWERED=1)
same => n,Set(ECNG_PROMPTS=${ARG3})
same => n,Set(ECNG_SURVEY_TELLER=${ARG4})
same => n,Set(ECNG_REGISTERED_CALLBACK=${ARG5})
same => n,Set(CHANNEL(hangup_handler_push)=ecng4308-survey-on-hangup,s,1)
same => n(done),Return()

; Mark that a teller answered
[ecng4308-survey-agent-answered]
exten => s,1,Set(ECNG_SURVEY_AGENT_CHANNEL=${CHANNEL(name)})
 same => n,Set(MASTER_CHANNEL(ECNG_SURVEY_TELLER)=${CUT(ECNG_SURVEY_AGENT_CHANNEL,-,1)})
 same => n,Set(MASTER_CHANNEL(ECNG_SURVEY_AGENT_ANSWERED)=1)
 same => n,Return()

; Queue a survey when the original customer call ends
[ecng4308-survey-on-hangup]
exten => s,1,GotoIf($["${ECNG_SURVEY_CONSENT}" != "1"]?done)
 same => n,GotoIf($["${ECNG_SURVEY_AGENT_ANSWERED}" != "1"]?done)
 same => n,GotoIf($[${REGEX("^(100[12]|110[12])$" ${ECNG_REGISTERED_CALLBACK})} = 0]?done)
 same => n,TrySystem(/usr/bin/python3 /usr/local/sbin/ecng4308-schedule-survey.py '${ECNG_SURVEY_SOURCE_ID}' '${ECNG_REGISTERED_CALLBACK}' '${ECNG_PROMPTS}' '${ECNG_SURVEY_TELLER}')
 same => n(done),Return()

; Play the outbound survey and save a valid answer
[ecng4308-survey]
exten => s,1,Set(CDR(userfield)=ecng4308-survey-${ECNG_SURVEY_ID})
 same => n,Read(ECNG_SURVEY_RATING,${ECNG_SURVEY_PROMPTS}/survey-rating,1,,1,8)
 same => n,GotoIf($["${READSTATUS}" != "OK"]?done)
 same => n,GotoIf($[${REGEX("^[1-5]$" ${ECNG_SURVEY_RATING})} = 0]?done)
 same => n,Set(DB(ecng4308-survey-results/${ECNG_SURVEY_ID})=${ECNG_SURVEY_RATING}|${ECNG_SURVEY_TELLER})
 same => n,Playback(${ECNG_SURVEY_PROMPTS}/goodbye)
 same => n(done),Hangup()

; Feature 10 low-balance alert
[ecng4308-feature10-low-balance]
exten => s,1,GotoIf($[${REGEX("^[0-9]+$" ${ECNG_BALANCE_PIASTERS})} = 0]?done)
 same => n,GotoIf($[${ECNG_BALANCE_PIASTERS} >= ${ECNG_LOW_BALANCE_PIASTERS}]?done)
 same => n,GotoIf($[${REGEX("^(100[12]|110[12])$" ${ECNG_REGISTERED_CALLBACK})} = 0]?done)
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/2201)}" != "NOT_INUSE"]?done)
 same => n,Originate(PJSIP/2201,exten,ecng4308-feature10-deliver,${ECNG_REGISTERED_CALLBACK},1,20,a)
 same => n(done),Return()

; Feature 10 suspected impersonation
[ecng4308-feature10-pin-failed]
exten => s,1,GotoIf($["${ECNG_BAD_PIN_TOKEN}" = ""]?reset)
 same => n,GotoIf($["${ECNG_BAD_PIN_TOKEN}" = "${ECNG_LAST_BAD_PIN_TOKEN}"]?count)
 same => n,Set(ECNG_LAST_BAD_PIN_TOKEN=${ECNG_BAD_PIN_TOKEN})
 same => n,Set(ECNG_BAD_PIN_COUNT=0)
 same => n(count),Set(ECNG_BAD_PIN_COUNT=$[${ECNG_BAD_PIN_COUNT}+1])
 same => n,GotoIf($[${ECNG_BAD_PIN_COUNT} != 3]?done)
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/2201)}" != "NOT_INUSE"]?done)
 same => n,Originate(PJSIP/2201,exten,ecng4308-feature10-deliver,${ECNG_BAD_PIN_NUMBER},1,20,av(ECNG_ALERT_REASON=suspected-impersonation))
 same => n,Goto(done)
 same => n(reset),Set(ECNG_LAST_BAD_PIN_TOKEN=)
 same => n,Set(ECNG_BAD_PIN_COUNT=0)
 same => n(done),Return()

[ecng4308-feature10-deliver]
exten => _100[12],1,Gosub(deliver,1(${EXTEN}))
 same => n,Hangup()

exten => _110[12],1,Gosub(deliver,1(${EXTEN}))
 same => n,Hangup()

exten => deliver,1,ExecIf($["${ECNG_ALERT_REASON}" = ""]?Set(ECNG_ALERT_REASON=low-balance))
 same => n,Set(CDR(userfield)=ecng4308-feature10-${ECNG_ALERT_REASON})
 same => n,Dial(PJSIP/${ARG1},25,i)
 same => n,Return()
