; ==============================
; UDP SIP TRANSPORT
; ==============================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062

; ==============================
; Common types initiation 
; ==============================

[bank-phone](!)
type=endpoint
disallow=all
allow=ulaw
direct_media=no
dtmf_mode=rfc4733
allow_transfer=no
device_state_busy_at=1

; ==============================
; Phase 1, and prospective customers
; ==============================

; ==============================
; EXTENSION 1001
; ==============================

[1001](bank-phone)
context=ecng4308-customers
auth=auth1001
aors=1001


[auth1001]
type=auth
auth_type=userpass
username=1001
password=Pass1001!

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=15


